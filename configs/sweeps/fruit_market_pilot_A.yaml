# Pilot of step A (docs/fruit_market_sweep.md, stage 3): the whole pipeline end to end on a tiny sweep, not a result.
# python -m src.sweep.run configs/sweeps/fruit_market_pilot_A.yaml --workers 2
# python -m src.sweep.summarise configs/sweeps/fruit_market_pilot_A.yaml
name: fruit_market_pilot_A
scenario: fruit_market
step: pilot_A
agent_types: [baseline]
seeds: [1, 2]
episodes: 4
epsilon_floor_fraction: 0.7
search:
  method: random
  configurations: 3
  sampling_seed: 0
  include_base: true
parameters:
  learning_rate: {log_uniform: [3.0e-5, 1.0e-3]}
  gamma: [0.9, 0.95, 0.99]
  target_update_interval: [50, 200, 1000]
  max_experiences: [100000, 300000]
  epsilon_min: [0.01, 0.05]
early_stopping: {episode: 3, window: 2, min_reward: null, max_action_share: 0.95}
selection: {rule: step_a, last_episodes: 2}
