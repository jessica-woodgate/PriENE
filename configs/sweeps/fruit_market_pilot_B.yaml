name: fruit_market_pilot_B
scenario: fruit_market
step: pilot_B
agent_types: [utilitarian, veto]
seeds: [1, 2]
episodes: 3
epsilon_floor_fraction: 0.7
search:
  method: list
  include_base: false
configurations:
  - {sanction: 1.0}
  - {sanction: 6.0}
early_stopping: {episode: 2, window: 2, min_reward: null, max_action_share: 0.95}
selection: {rule: step_b, last_episodes: 2}
