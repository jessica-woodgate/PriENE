# Reward trial (docs/reward_checks.md, docs/reward_checks_sanctions.md): configs/rewards/suggested_death5.yaml (death -5) with sanction
# 1.0: the large death penalty keeps surviving worthwhile up to sanction 1, at which sharing pays for egalitarian and veto agents. Every
# other parameter is configs/training/harvest.yaml's.
learning_rate: 0.0001
gamma: 0.95
batch_size: 64
hidden_units: 128
huber_delta: 1.0
min_experiences: 100
max_experiences: 100000
target_update_interval: 50
epsilon_start: 1.0
epsilon_min: 0.01
epsilon_decay: 0.001
max_training_episodes: null
sanction: 1.0
rewards:
  death: -5
  no_berries: -0.1
  no_benefactor: -0.1
  insufficient_health: -0.1
  neutral_reward: 0
  throw: 0
  forage: 0
  eat: 1
  survive: 1
ethics_rewards: {}
