# Training parameters for the fruit_market scenario: the harvest scenarios' learning values, with Fruit Market's ethics sanction
# (docs/fruit_market_design.md §6.1). run.py uses this file unless --training-config gives another; the parameter sweep
# (docs/fruit_market_sweep.md) writes its own per run. See src/training_config.py for what each parameter does.
learning_rate: 0.0001
gamma: 0.95
batch_size: 64
hidden_units: 128
huber_delta: 1.0
min_experiences: 100
max_experiences: 100000
target_update_interval: 50
epsilon_start: 1.0
epsilon_min: 0.01
epsilon_decay: 0.001
# null: train until epsilon reaches epsilon_min (about 4600 episodes)
max_training_episodes: null
sanction: 3.5
