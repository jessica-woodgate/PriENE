# Reward trial: suggested_s1.yaml (death -1, two-sided sanction 1.0) with no -0.1 penalties (no_berries, no_benefactor and
# insufficient_health are 0). Vs suggested_s1 isolates the penalties. Every other parameter is configs/training/harvest.yaml's.
learning_rate: 0.0001
gamma: 0.95
batch_size: 64
hidden_units: 128
huber_delta: 1.0
min_experiences: 100
max_experiences: 100000
target_update_interval: 50
epsilon_start: 1.0
epsilon_min: 0.01
epsilon_decay: 0.001
max_training_episodes: null
sanction: 1.0
rewards:
  death: -1
  no_berries: 0
  no_benefactor: 0
  insufficient_health: 0
  neutral_reward: 0
  throw: 0
  forage: 0
  eat: 1
  survive: 1
ethics_rewards: {}
