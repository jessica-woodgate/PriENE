# Training parameters for every harvest scenario (basic, colours, capabilities, allotment, commons): the values the paper's agents were
# trained with. run.py uses this file unless --training-config gives another. See src/training_config.py for what each parameter does.
learning_rate: 0.0001
gamma: 0.95
batch_size: 64
hidden_units: 128
huber_delta: 1.0
min_experiences: 100
max_experiences: 100000
target_update_interval: 50
epsilon_start: 1.0
epsilon_min: 0.01
epsilon_decay: 0.001
# null: train until epsilon reaches epsilon_min (about 4600 episodes)
max_training_episodes: null
sanction: 0.4
# a baseline agent's reward for each outcome of its action: dying, trying to throw with no berries, with no one to throw to or with too
# little health, an action with no other effect, throwing, foraging and eating a berry, and surviving to the episode's last day
rewards:
  death: -1
  no_berries: -0.2
  no_benefactor: -0.2
  insufficient_health: -0.2
  neutral_reward: 0
  throw: 0.5
  forage: 0.5
  eat: 1
  survive: 1
# the rewards ethics agents get instead of the baseline's, for these outcomes (they also get the sanction)
ethics_rewards:
  no_berries: -0.1
  no_benefactor: -0.1
  insufficient_health: -0.1
  eat: 0.8
