# Reward trials: configs/training/suggested.yaml (sanction 0.4), every society, training seeds 101-103, training only. Baseline
# agents get no sanction, so these baseline runs also stand for the suggested_s06 and suggested_positive_s14 trials.
#   python run.py experiments configs/experiments/reward_trials_suggested.yaml --max-workers 2
name: reward_trials
output_root: runs
seeds: [101, 102, 103]
societies: [baseline, maximin, utilitarian, egalitarian, average, majoritarian, optimist, veto]
society_mix: homogeneous
training_config: configs/training/suggested.yaml
checkpoint_every: 10
#training trains on at the exploration floor until learning has converged (src/convergence.py), up to episode 10000
until_converged: true
convergence_max_episodes: 10000
num_threads: 1
train:
  - {scenario: basic, seasons: n, days: 200, num_agents: 4}
tests: []
