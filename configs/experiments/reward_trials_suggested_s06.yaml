# Reward trials: configs/training/suggested_s06.yaml (sanction 0.6), every ethics society, training seeds 101-103, training only (baseline agents get
# no sanction, so they would train as in reward_trials_suggested.yaml).
#   python run.py experiments configs/experiments/reward_trials_suggested_s06.yaml
name: reward_trials
output_root: runs
seeds: [101, 102, 103]
societies: [maximin, utilitarian, egalitarian, average, majoritarian, optimist, veto]
society_mix: homogeneous
training_config: configs/training/suggested_s06.yaml
checkpoint_every: 10
num_threads: 1
train:
  - {scenario: basic, seasons: n, days: 200, num_agents: 4}
tests: []
